# Expense Analyzer — runs alongside Home Assistant on the Raspberry Pi.
# See internal_docs/expense-analyzer-design.md §3.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # The shared /opt/stack PostgreSQL on the Pi (NOT a service of this
      # compose). Full URL incl. credentials, e.g.
      #   postgresql+psycopg://expense_analyzer:...@192.168.1.x:5432/expense_analyzer
      # Must be set (no silent dev fallback for a finance app).
      EA_DATABASE_URL: ${EA_DATABASE_URL:?set EA_DATABASE_URL in your environment or .env}
      EA_DATA_PATH: /data
      # Pinned explicitly: the in-code default is the relative data/attachments,
      # which inside the container would be /app/data — ephemeral, lost on
      # rebuild. Uploaded loan documents must live on the mounted volume.
      EA_ATTACHMENTS_PATH: /data/attachments
      # Backup retention for `make backup` / the §10 cron (deploy.sh reads the
      # same variable from .env itself). Interpolated here because the host
      # .env never reaches the container (it's dockerignored).
      EA_BACKUP_KEEP: ${EA_BACKUP_KEEP:-14}
      # Must be set (no silent dev fallback for a finance app). Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      EA_SECRET_KEY: ${EA_SECRET_KEY:?set EA_SECRET_KEY in your environment or .env}
      # Session cookie is Secure — the browser only sends it over HTTPS (Caddy).
      EA_SECURE_COOKIES: "true"
      # Home Assistant MQTT push (Phase 7). OFF unless EA_MQTT_HOST is set; the
      # broker is your HA broker on the LAN (not internet egress). The app uses
      # these for the manual "Publish now" button; the worker auto-publishes.
      EA_MQTT_HOST: ${EA_MQTT_HOST:-}
      EA_MQTT_PORT: ${EA_MQTT_PORT:-1883}
      EA_MQTT_USERNAME: ${EA_MQTT_USERNAME:-}
      EA_MQTT_PASSWORD: ${EA_MQTT_PASSWORD:-}
      EA_MQTT_BASE_TOPIC: ${EA_MQTT_BASE_TOPIC:-expense_analyzer}
      EA_MQTT_DISCOVERY_PREFIX: ${EA_MQTT_DISCOVERY_PREFIX:-homeassistant}
    volumes:
      - ./data:/data
    # Run migrations, then start the server. Bind only to localhost; Caddy is
    # the only thing that should reach the app directly.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn expense_analyzer.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    healthcheck:
      # /health turns 200 only after migrations ran and the server is up, so a
      # healthy app is the signal that the DB is migrated and reachable.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    environment:
      # Same shared /opt/stack PostgreSQL as the app (see above).
      EA_DATABASE_URL: ${EA_DATABASE_URL:?set EA_DATABASE_URL in your environment or .env}
      EA_DATA_PATH: /data
      EA_ATTACHMENTS_PATH: /data/attachments
      # Home Assistant MQTT push (Phase 7). The worker publishes household metrics
      # every EA_MQTT_PUBLISH_INTERVAL_MINUTES. OFF unless both the host and a
      # positive interval are set; the broker is your HA broker on the LAN.
      EA_MQTT_HOST: ${EA_MQTT_HOST:-}
      EA_MQTT_PORT: ${EA_MQTT_PORT:-1883}
      EA_MQTT_USERNAME: ${EA_MQTT_USERNAME:-}
      EA_MQTT_PASSWORD: ${EA_MQTT_PASSWORD:-}
      EA_MQTT_BASE_TOPIC: ${EA_MQTT_BASE_TOPIC:-expense_analyzer}
      EA_MQTT_DISCOVERY_PREFIX: ${EA_MQTT_DISCOVERY_PREFIX:-homeassistant}
      EA_MQTT_PUBLISH_INTERVAL_MINUTES: ${EA_MQTT_PUBLISH_INTERVAL_MINUTES:-}
    volumes:
      - ./data:/data
    command: ["python", "-m", "expense_analyzer.worker"]
    depends_on:
      app:
        # Wait until migrations have run (app is healthy) before touching the DB.
        condition: service_healthy

  caddy:
    # Custom Caddy with the GoDaddy DNS plugin (Dockerfile.caddy) — needed for the
    # trusted Let's Encrypt cert via the ACME DNS-01 challenge.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      # The domain you reach the app at (e.g. expense.domain.com); Caddy issues a
      # trusted Let's Encrypt cert for it via DNS-01. Must resolve to the Pi's LAN
      # IP on your network (router DNS / Pi-hole / hosts).
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-expense.local}
      # GoDaddy API credentials ("<KEY>:<SECRET>", a Production key) for the
      # DNS-01 challenge. Required — without it Caddy can't obtain the cert.
      GODADDY_API_TOKEN: ${GODADDY_API_TOKEN:?set GODADDY_API_TOKEN in your environment or .env}
    ports:
      # HTTPS (LAN only). :80 only issues a 301 redirect to HTTPS — no app data.
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
