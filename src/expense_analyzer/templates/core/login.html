{% extends "base.html" %}
{% block title %}Log in — Expense Analyzer{% endblock %}
{% block content %}
  <div class="panel" style="max-width:360px; margin:40px auto;">
    <h1>Log in</h1>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username"
             name="username"
             autocomplete="username"
             autofocus
             required>
      <label for="password">Password</label>
      <input id="password"
             name="password"
             type="password"
             autocomplete="current-password"
             required>
      <p style="margin-top:16px">
        <button class="w-full" type="submit">Log in</button>
      </p>
    </form>
  </div>
{% endblock %}
