[project]
name = "expense-analyzer"
version = "1.0.0"
description = "Locally hosted household finance analyzer (Raspberry Pi + Home Assistant)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.49.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    # PostgreSQL driver (the production database lives in the owner's separate
    # /opt/stack compose on the Pi — see docker-compose.yml). SQLite needs no
    # driver and remains the zero-setup default for local dev.
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    # Outbound HTTP client for the opt-in myFund.pl investment pull (Phase 6).
    # Off by default (no API key -> no calls); also what the test client uses.
    "httpx>=0.28",
    # MQTT client for the opt-in Home Assistant push (Phase 7). Off by default
    # (no EA_MQTT_HOST -> the worker never connects); the broker lives on the LAN
    # (your HA broker), so this is not internet egress.
    "paho-mqtt>=2.1",
    # Text classifier for categorization layer 2 (Phase 11): TF-IDF + logistic
    # regression (design §7.7). A local library, not a service — no egress, nothing
    # leaves the Pi. Pulls numpy/scipy; the owner OK'd the footprint (external SSD).
    "scikit-learn>=1.5",
    # Embeddings for categorization layer 3 (Phase 12): sentence-transformers powers
    # the "similar past transaction" hint in the review queue (design §7.7 point 3).
    # Pulls torch — heavy, but a *local* library, not a service. The model weights
    # are baked into the Docker image at build time and read offline at runtime
    # (HF_HUB_OFFLINE=1), so nothing leaves the Pi. Footprint OK'd (external SSD).
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    # Jinja template formatter (used as a *formatter*, like ruff-format — not as a
    # linter: djlint's lint rules are mostly inapplicable here, see PROGRESS.md).
    "djlint>=1.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_analyzer"]

[tool.pytest.ini_options]
# "src" puts the package on the path; "." (repo root) lets a few tests import the
# shared FakeImporter via `from tests.conftest import ...` — without it that
# namespace package only resolves under `python -m pytest` (which adds CWD), not
# the `uv run pytest` the Makefile uses.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.djlint]
# Used as a formatter only (pre-commit hook djlint-reformat-jinja). The lint rules
# are not run — for this FastAPI + LAN app most are inapplicable (J018 url_for,
# H030/H031 SEO meta) or stylistic (H021 inline style, T003 endblock names).
profile = "jinja"
indent = 2

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; long lines are unavoidable and not worth reflowing.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses callables in argument defaults by design (Depends/Form/File/Query).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
]
