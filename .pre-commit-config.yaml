# Run `uv run pre-commit install` once to enable. See README.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --show-fixes, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      # Runs hadolint via Docker, so no local binary needed.
      - id: hadolint-docker

  - repo: local
    hooks:
      # Fail if models drifted from migrations (autogenerate would be non-empty).
      - id: alembic-check
        name: alembic check (model/migration drift)
        entry: scripts/alembic_check.sh
        language: script
        pass_filenames: false
        files: ^(src/expense_analyzer/models\.py$|alembic/)
